name: CI

on:
  push:
    branches: [main]
  # Every pull request, including those stacked on other branches.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0 builds every target framework; the 8.0 runtime runs the net8.0 tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build TestingVial.NET.slnx -c Release

      - name: Test
        run: dotnet test TestingVial.NET.slnx -c Release --no-build --logger "trx" --results-directory ./test-results

      - name: Pack
        run: dotnet pack TestingVial.NET/TestingVial.NET.csproj -c Release --no-build -o ./artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.trx

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
